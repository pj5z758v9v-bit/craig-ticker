<script>
var DATA = {"updated":"2026-10-26T09:42:57.808817-04:00","market_open":true,"rows":[{"ticker":"MU","price":908.03,"pct":3.47,"chg":30.48},{"ticker":"NVDA","price":215.47,"pct":2.14,"chg":4.51},{"ticker":"GOOG","price":315.89,"pct":-0.44,"chg":-1.39},{"ticker":"QQQ","price":708.37,"pct":0.56,"chg":3.97},{"ticker":"CRWD","price":259.59,"pct":0.78,"chg":2.02},{"ticker":"LLY","price":1284.14,"pct":0.84,"chg":10.68},{"ticker":"AMZN","price":247.94,"pct":-0.03,"chg":-0.06},{"ticker":"AMD","price":523.25,"pct":1.25,"chg":6.47},{"ticker":"SNDK","price":1276.01,"pct":3.07,"chg":37.98},{"ticker":"TSLA","price":393.09,"pct":5.61,"chg":20.87},{"ticker":"AAPL","price":343.03,"pct":-1.35,"chg":-4.7},{"ticker":"STX","price":642.45,"pct":1.9,"chg":11.96},{"ticker":"SPY","price":763.12,"pct":0.41,"chg":3.15},{"ticker":"META","price":633.26,"pct":-1.46,"chg":-9.36},{"ticker":"WDC","price":350.76,"pct":2.06,"chg":7.09},{"ticker":"CAT","price":683.13,"pct":-0.56,"chg":-3.87},{"ticker":"AVGO","price":326.09,"pct":1.37,"chg":4.41},{"ticker":"MSFT","price":523.29,"pct":-0.23,"chg":-1.22},{"ticker":"GOOGL","price":319.26,"pct":-0.3,"chg":-0.95},{"ticker":"SPCX","price":147.05,"pct":-0.3,"chg":-0.44},{"ticker":"AEM","price":172.19,"pct":-1.0,"chg":-1.75},{"ticker":"PLTR","price":193.94,"pct":-1.43,"chg":-2.81},{"ticker":"MRNA","price":186.62,"pct":-6.74,"chg":-13.49}]};
(function(){
var cv=document.getElementById("c"),cx=cv.getContext("2d"),svg=document.getElementById("m"),
 wheel=document.getElementById("wheel"),arm=document.getElementById("arm");
var W,H,DPR,TH,FONT,CHW,SPEED,MX,MY,SC,FLAT,PORT;
var MONO='"Courier New",Courier,"Liberation Mono","Nimbus Mono PS",monospace';
var data=DATA,tiles=[],U=0,uEnd=0,queue=[],last=performance.now(),t0=last,lastChar=0,armT=0;
var m=location.search.match(/[?&]t=([\d.]+)/), fakeT=m?+m[1]*1000:0, FREEZE=/[?&]freeze=1/.test(location.search);
function layout(){
 DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;PORT=H>W;
 cv.width=W*DPR;cv.height=H*DPR;
 var mw=PORT?Math.min(W*0.42,170):Math.min(W*0.24,H*0.5,300);SC=mw/300;
 TH=PORT?Math.max(50,Math.min(W*0.15,84)):Math.max(56,Math.min(H*0.17,W*0.1,130));
 FONT=Math.round(TH*0.56);
 cx.font="700 "+FONT+"px "+MONO;CHW=cx.measureText("M").width;
 SPEED=CHW*(PORT?3.2:4.2);
 var mx=PORT?W*0.02:W*0.025, my=PORT?H*0.30-247*SC:H*0.40-247*SC;
 svg.style.transform="translate("+(W-mx)+"px,"+my+"px) scale("+(-SC)+","+SC+")"; // mirrored machine at right; all tape geometry below is in mirrored x (x'=W-x)
 MX=mx+284*SC;MY=my+247*SC;
 FLAT=(PORT?W*0.8:W*0.72)-MX;
 // rebuild tiles at new size
 var keepU=U;tiles=[];uEnd=keepU-(FLAT+60);if(uEnd<0)uEnd=0;U=keepU;queue=[];fill();
}
function money(v,d){return v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});}
function items(){var d=data,out=[];if(!d||!d.rows||!d.rows.length)return [{s:"AWAITING WIRE ",c:0}];
 d.rows.forEach(function(r){out.push({s:r.ticker+" $"+money(r.price,2),p:r.pct,d:r.chg});});return out;}
var RS=1;function rand(){RS=(RS*1664525+1013904223)>>>0;return RS/4294967296;}
function rnd(a){return (rand()*2-1)*a}
function makeTile(it){
 var arrow="",h0=7;for(var q=0;q<it.s.length;q++)h0=(h0*31+it.s.charCodeAt(q))>>>0;RS=h0;var ch="",col="#1d1610";
 if(it.d!=null){var r=Math.round(it.d*100)/100;arrow=r>0?"\u25B2":r<0?"\u25BC":"=";ch=arrow+" $"+money(Math.abs(r),2);col=r>0?"#1f6b2c":r<0?"#a3201a":"#555";}
 var main=it.s+(ch?" ":""),sep="   \u00B7   ";
 var fs=it.tot?Math.round(FONT*1.12):FONT, f="700 "+fs+"px "+MONO;
 cx.font=f;var w=Math.ceil(cx.measureText(main+ch+sep).width)+4;
 var c=document.createElement("canvas");c.width=Math.ceil(w*DPR);c.height=Math.ceil(TH*DPR);
 var g=c.getContext("2d");g.scale(DPR,DPR);
 // aged cream paper
 g.fillStyle="#efe3c4";g.fillRect(0,0,w,TH);
 var gr=g.createLinearGradient(0,0,0,TH);gr.addColorStop(0,"rgba(120,90,40,.22)");gr.addColorStop(.12,"rgba(0,0,0,0)");gr.addColorStop(.88,"rgba(0,0,0,0)");gr.addColorStop(1,"rgba(120,90,40,.28)");
 g.fillStyle=gr;g.fillRect(0,0,w,TH);
 for(var i=0;i<w*0.5;i++){g.fillStyle="rgba("+(110+rand()*60|0)+","+(80+rand()*40|0)+",40,"+(rand()*0.10)+")";
  g.fillRect(rand()*w,rand()*TH,2+rand()*9,0.6+rand()*0.8);}
 for(i=0;i<w*0.03;i++){g.fillStyle="rgba(140,100,50,.06)";g.beginPath();g.arc(rand()*w,rand()*TH,3+rand()*10,0,7);g.fill();}
 if(it.tot){g.fillStyle="rgba(160,40,30,.85)";g.fillRect(0,TH*0.1,w-CHW*2,2);g.fillRect(0,TH*0.88,w-CHW*2,2);}
 // ink, character by character, faintly uneven
 g.font=f;g.textBaseline="middle";var x=2,base=TH*0.54,s=main+ch,cw=g.measureText("M").width,chars=[];
 for(i=0;i<s.length;i++){var k=s[i],isCh=i>=main.length;
  g.globalAlpha=0.78+rand()*0.22;g.fillStyle=isCh?col:(it.tot?"#2a1208":"#1d1610");
  g.fillText(k,x+rnd(0.6),base+rnd(1.2));
  if(rand()<0.5){g.globalAlpha=0.12;g.fillText(k,x+rnd(1.2),base+rnd(1.5));}
  if(k!==" ")chars.push(x);x+=cw;}
 g.globalAlpha=0.6;g.fillStyle="#6b5a40";g.fillText(sep,x,base);g.globalAlpha=1;
 return {c:c,w:w,u:uEnd,chars:chars};
}
function fill(){while(uEnd<U+40){if(!queue.length)queue=items();var t=makeTile(queue.shift());t.u=uEnd;uEnd+=t.w;tiles.push(t);}
 var minU=U-(FLAT+Math.max(W,H)*2.2);while(tiles.length&&tiles[0].u+tiles[0].w<minU)tiles.shift();}
// draw strip [u0,u1) of tape coordinate into current transform at x=0..(u1-u0) (tape runs right-to-left in u)
function strip(u0,u1,dx){for(var i=0;i<tiles.length;i++){var t=tiles[i];var a=Math.max(u0,t.u),b=Math.min(u1,t.u+t.w);if(b<=a)continue;
  cx.save();cx.translate(dx+u1-a,0);cx.scale(-1,1);
  cx.drawImage(t.c,(a-t.u)*DPR,0,(b-a)*DPR,t.c.height,0,-TH/2,(b-a),TH);cx.restore();}}
function frame(now){
 var ms=fakeT?fakeT+(FREEZE?0:now-t0):now; var dt=Math.max(0,Math.min(0.5,(now-last)/1000));last=now;
 if(fakeT)U=SPEED*ms/1000;else U+=SPEED*dt;fill();var T=ms/1000;
 cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,W,H);cx.setTransform(-DPR,0,0,DPR,W*DPR,0);cx.imageSmoothingQuality="high";
 // --- flat legible span: tape coordinate u at screen x = MX+d is U-d
 cx.save();cx.translate(MX,MY);
 cx.shadowColor="rgba(0,0,0,.55)";cx.shadowBlur=18;cx.shadowOffsetY=10;cx.fillStyle="#efe3c4";cx.fillRect(0,-TH/2,FLAT+1,TH);cx.shadowColor="transparent";
 strip(U-FLAT-1,U,0);cx.restore();
 // --- curl: integrate a bending, twisting ribbon in thin slices
 var x=MX+FLAT,y=MY,th=0,step=PORT?2:2.5,s=0,maxS=Math.max(W,H)*2,R=PORT?W*0.22:H*0.42,RT=PORT?H*0.32:H*0.3;
 var shade=[];
 for(s=0;s<maxS;s+=step){
  var u=U-FLAT-s; if(u<0)break;
  var k=s/R; th=Math.min(PORT?1.5:1.45,1.6*k*k/(1+0.5*k*k)*(PORT?1.5:1.25)) + Math.sin(T*0.35+s*0.004)*0.12*Math.min(1,k*0.7);
  var tw=Math.pow(Math.max(0,s-TH*0.6)/RT,1.35)*2.6 + Math.sin(T*0.4+s*0.006)*0.15*Math.min(1,k*1.5);
  var cs=Math.cos(tw),sy=Math.abs(cs); if(sy<0.06)sy=0.06;
  var fade=Math.max(0,1-Math.max(0,s-maxS*0.55)/(maxS*0.45));
  if(x>W+TH*2||y>H+TH*2)break;
  cx.setTransform(-DPR,0,0,DPR,W*DPR,0);cx.translate(x,y);cx.rotate(th);
  cx.scale(1,sy);
  cx.globalAlpha=fade;
  if(cs>0){strip(u-step-1,u,0);}else{cx.fillStyle="#d9c9a2";cx.fillRect(0,-TH/2,step+1,TH);}
  // shading: darker as it turns edge-on
  var dk=(1-sy)*0.55+(cs<0?0.15:0);if(dk>0.02){cx.fillStyle="rgba(40,25,10,"+dk+")";cx.fillRect(0,-TH/2,step+1,TH);}
  cx.globalAlpha=1;
  x+=Math.cos(th)*step;y+=Math.sin(th)*step+ (PORT?0:0);
 }
 cx.setTransform(DPR,0,0,DPR,0,0);
 // mechanism motion: wheel spins with feed; arm strikes as each char passes mouth
 wheel.setAttribute("transform","rotate("+((U/CHW)*36%360).toFixed(1)+")");
 var cn=Math.floor(U/CHW); if(cn!==lastChar){lastChar=cn;armT=1;}
 armT=Math.max(0,armT-dt*9);if(fakeT)armT=0;
 arm.setAttribute("transform","rotate("+(armT*6).toFixed(2)+" 112 186)");
 requestAnimationFrame(frame);
}
function fmtTime(s){var d=new Date(s);if(isNaN(d))return s;return d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZone:"America/New_York"})+" ET";}
function hud(){if(!data)return;document.getElementById("tot").textContent="";
 document.getElementById("upd").textContent=fmtTime(data.updated)+" \u00b7 "+(data.market_open?"market open":"closed");}
function refresh(){fetch("public.json?_="+Date.now(),{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){if(d&&d.rows){data=d;hud();}}).catch(function(){});}
var rt;addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(layout,120);});
layout();hud();
if(fakeT){U=SPEED*fakeT/1000;uEnd=0;tiles=[];queue=[];fill();}
if(location.protocol!=="file:")refresh();setInterval(refresh,60000);
requestAnimationFrame(frame);
})();
</script></body></html>
